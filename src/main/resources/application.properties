spring.application.name=student-management
server.port=8080

# ---- MySQL (change the password, or set the DB_PASSWORD environment variable) ----
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}

# Run schema.sql (creates the tables) every time the app starts
spring.sql.init.mode=always
